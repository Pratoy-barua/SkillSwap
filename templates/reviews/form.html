{% extends 'base.html' %}{% block title %}Review mentor · SkillSwap{% endblock %}{% block content %}<section class="section"><div class="container"><div class="soft-card p-4 mx-auto" style="max-width:680px"><p class="eyebrow">Completed learning</p><h1 class="section-heading h2">Review {{ relationship.mentor.full_name }}</h1><p class="text-secondary">{{ relationship.skill.name }} · Tell the community about your learning experience.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">Rating</label><select class="form-select mb-3" name="rating" required>{% for n in range(5,0,-1) %}<option value="{{ n }}" {% if review and review.rating == n %}selected{% endif %}>{{ n }}/5</option>{% endfor %}</select><label class="form-label">Review</label><textarea class="form-control mb-3" name="review_text" rows="5" maxlength="4000" placeholder="Share a helpful, honest review">{{ review.review_text if review else '' }}</textarea><button class="btn btn-primary">Publish review</button></form></div></div></section>{% endblock %}
