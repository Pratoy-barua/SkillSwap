{% extends 'base.html' %}
{% block title %}Admin Login · SkillSwap{% endblock %}
{% block content %}
<section class="placeholder-page"><div class="container"><div class="soft-card auth-card mx-auto p-4 p-md-5">
  <p class="eyebrow mb-2">Protected access</p><h1 class="section-heading h2 mb-2">Admin login</h1><p class="section-copy mb-4">Use the administrator credentials configured through the secure seed command.</p>
  {% include 'partials/flash.html' %}
  <form method="post" action="{{ url_for('auth.admin_login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="mb-3"><label class="form-label" for="email">Admin email</label><input class="form-control" id="email" name="email" type="email" required></div><div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div><button class="btn btn-primary w-100">Open admin dashboard</button></form>
</div></div></section>
{% endblock %}
