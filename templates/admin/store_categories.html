{% extends 'base.html' %}{% block title %}Store Categories · SkillSwap{% endblock %}{% block content %}<section class="section"><div class="container"><p class="eyebrow">Admin store</p><h1 class="section-heading h2">Product categories</h1><form method="post" class="soft-card p-3 my-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="input-group"><input class="form-control" name="name" placeholder="Category name" required><button class="btn btn-primary">Add category</button></div></form><div class="soft-card p-3">{% for category in categories %}<div class="d-flex justify-content-between py-3 border-bottom"><span>{{ category.name }}</span><form method="post" action="{{ url_for('admin.toggle_store_category', category_id=category.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-primary">{% if category.is_active %}Deactivate{% else %}Activate{% endif %}</button></form></div>{% endfor %}</div></div></section>{% endblock %}
