{% extends 'base.html' %}{% block title %}Skill Management · SkillSwap{% endblock %}{% block content %}<section class="section"><div class="container"><div class="d-flex justify-content-between mb-4"><div><p class="eyebrow">Admin tools</p><h1 class="section-heading h2">Skill management</h1></div><a class="btn btn-outline-primary" href="{{ url_for('admin.dashboard') }}">Dashboard</a></div>{% include 'partials/flash.html' %}<form method="post" class="soft-card p-3 mb-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="input-group"><input class="form-control" name="name" placeholder="New skill name" required><button class="btn btn-primary">Add skill</button></div></form><div class="soft-card p-3">{% for skill in skills %}<div class="d-flex justify-content-between align-items-center border-bottom py-3"><span>{{ skill.name }}</span><form method="post" action="{{ url_for('admin.toggle_skill', skill_id=skill.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm {% if skill.is_active %}btn-outline-warning{% else %}btn-outline-success{% endif %}">{% if skill.is_active %}Deactivate{% else %}Activate{% endif %}</button></form></div>{% else %}<p class="mb-0 text-secondary">No skills yet.</p>{% endfor %}</div></div></section>{% endblock %}
