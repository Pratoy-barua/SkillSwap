{% extends 'base.html' %}{% block title %}Product · SkillSwap{% endblock %}{% block content %}<section class="section"><div class="container"><div class="soft-card p-4 p-md-5 mx-auto" style="max-width: 820px;"><p class="eyebrow">Store management</p><h1 class="section-heading h2">{% if product %}Edit product{% else %}Add product{% endif %}</h1>{% include 'partials/flash.html' %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ product.name if product else '' }}" required></div><div class="col-md-4"><label class="form-label">Category</label><select class="form-select" name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4" required>{{ product.description if product else '' }}</textarea></div><div class="col-md-6"><label class="form-label">Price</label><input class="form-control" name="price" type="number" min="0" step=".01" value="{{ product.price if product else '' }}" required></div><div class="col-md-6"><label class="form-label">Stock</label><input class="form-control" name="stock" type="number" min="0" value="{{ product.stock if product else 0 }}" required></div><div class="col-12"><label class="form-label">Product image</label><input class="form-control" name="image" type="file" accept=".jpg,.jpeg,.png,.webp"></div></div><button class="btn btn-primary mt-4">Save product</button></form></div></div></section>{% endblock %}
