{% extends 'base.html' %}{% block title %}Learning Plan · SkillSwap{% endblock %}{% block content %}<section class="section"><div class="container"><div class="soft-card p-4 p-md-5 mx-auto" style="max-width: 820px;"><p class="eyebrow">Mentor tools</p><h1 class="section-heading h2">Create a learning plan</h1><p class="section-copy">The plan is saved to this active learner relationship.</p>{% include 'partials/flash.html' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="row g-3"><div class="col-12"><label class="form-label">Course title</label><input class="form-control" name="title" value="{{ plan.title if plan else '' }}" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ plan.description if plan else '' }}</textarea></div><div class="col-md-4"><label class="form-label">Price</label><input class="form-control" name="pricing" type="number" min="0" step=".01" value="{{ plan.pricing if plan else '' }}" required></div><div class="col-md-4"><label class="form-label">Pricing type</label><select class="form-select" name="pricing_type"><option>Daily</option><option>Weekly</option><option>Monthly</option><option selected>Course-based</option></select></div><div class="col-md-4"><label class="form-label">Start date</label><input class="form-control" name="start_date" type="date" value="{{ plan.start_date if plan else '' }}" required></div><div class="col-md-6"><label class="form-label">Expected completion</label><input class="form-control" name="expected_completion_date" type="date" value="{{ plan.expected_completion_date if plan else '' }}"></div></div><button class="btn btn-primary mt-4">Save learning plan</button></form></div></div></section>{% endblock %}
