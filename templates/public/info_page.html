{% extends 'base.html' %}

{% block title %}{{ eyebrow }} · SkillSwap{% endblock %}

{% block content %}
<section class="info-page">
  <div class="container">
    <div class="info-page-header">
      <p class="eyebrow mb-3">{{ eyebrow }}</p>
      <h1 class="section-heading">{{ title }}</h1>
      <p class="section-copy mb-0">{{ intro }}</p>
    </div>
    <div class="row g-4">
      {% for heading, copy in sections %}
      <div class="col-md-6">
        <article class="soft-card info-card h-100">
          <h2 class="h5 fw-bold">{{ heading }}</h2>
          <p class="mb-0">{{ copy }}</p>
        </article>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
