{% extends 'base.html' %}
{% block title %}Mentor Profile · SkillSwap{% endblock %}
{% block content %}
<section class="section"><div class="container"><div class="soft-card p-4 p-md-5 mx-auto" style="max-width: 900px;">
  <p class="eyebrow">Your mentor profile</p><h1 class="section-heading h2">Edit mentor profile</h1>
  {% include 'partials/flash.html' %}
  <form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ current_user.full_name }}" required></div>
      <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ current_user.phone }}" required></div>
      <div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ current_user.location.city }}" required></div>
      <div class="col-md-6"><label class="form-label">Area</label><input class="form-control" name="area" value="{{ current_user.location.area or '' }}"></div>
      <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ current_user.address }}" required></div>
      <div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" name="bio" rows="3" required>{{ profile.bio }}</textarea></div>
      <div class="col-md-6"><label class="form-label">Skills (comma separated)</label><input class="form-control" name="skills" value="{% for item in profile.skills %}{{ item.skill.name }}{% if not loop.last %}, {% endif %}{% endfor %}"></div>
      <div class="col-md-6"><label class="form-label">Experience</label><input class="form-control" name="experience" value="{{ profile.experience }}" required></div>
      <div class="col-md-4"><label class="form-label">Teaching type</label><input class="form-control" name="teaching_type" value="{{ profile.teaching_type }}" required></div>
      <div class="col-md-4"><label class="form-label">Free or paid</label><select class="form-select" name="is_paid"><option value="free" {% if not profile.is_paid %}selected{% endif %}>Free</option><option value="paid" {% if profile.is_paid %}selected{% endif %}>Paid</option></select></div>
      <div class="col-md-4"><label class="form-label">Pricing type</label><select class="form-select" name="pricing_type"><option>Daily</option><option>Weekly</option><option>Monthly</option><option selected>Course-based</option></select></div>
      <div class="col-md-4"><label class="form-label">Price</label><input class="form-control" name="pricing" type="number" min="0" step="0.01" value="{{ profile.pricing or '' }}"></div>
      <div class="col-12"><label class="form-label">New profile photo</label><input class="form-control" name="profile_photo" type="file" accept=".jpg,.jpeg,.png,.webp"></div>
    </div><button class="btn btn-primary mt-4">Save changes</button>
  </form>
</div></div></section>
{% endblock %}
