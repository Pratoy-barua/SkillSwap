{% extends 'base.html' %}
{% block title %}Learner Profile · SkillSwap{% endblock %}
{% block content %}
<section class="section"><div class="container"><div class="soft-card p-4 p-md-5 mx-auto" style="max-width: 820px;">
  <p class="eyebrow">Your profile</p><h1 class="section-heading h2">Edit learner profile</h1>
  {% include 'partials/flash.html' %}
  <form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ current_user.full_name }}" required></div>
      <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ current_user.phone }}" required></div>
      <div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ current_user.location.city }}" required></div>
      <div class="col-md-6"><label class="form-label">Area</label><input class="form-control" name="area" value="{{ current_user.location.area or '' }}"></div>
      <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ current_user.address }}" required></div>
      <div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" name="bio" rows="3">{{ profile.bio or '' }}</textarea></div>
      <div class="col-12"><label class="form-label">Learning interests</label><textarea class="form-control" name="interests" rows="3">{{ profile.interests or '' }}</textarea></div>
      <div class="col-12"><label class="form-label">New profile photo</label><input class="form-control" name="profile_photo" type="file" accept=".jpg,.jpeg,.png,.webp"></div>
    </div><button class="btn btn-primary mt-4">Save changes</button>
  </form>
</div></div></section>
{% endblock %}
