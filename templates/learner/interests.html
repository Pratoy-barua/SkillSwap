{% extends 'base.html' %}{% block title %}Learning Interests · SkillSwap{% endblock %}{% block content %}<section class="section"><div class="container"><div class="soft-card p-4 p-md-5 mx-auto" style="max-width: 760px;"><p class="eyebrow">Learner preferences</p><h1 class="section-heading h2">Choose skills you want to learn.</h1>{% include 'partials/flash.html' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="row row-cols-2 row-cols-md-3 g-3 mb-4">{% for skill in skills %}<div class="col"><label class="skill-card h-100"><input class="form-check-input me-2" type="checkbox" name="skill_ids" value="{{ skill.id }}" {% if skill.id in profile.skills|map(attribute='skill_id')|list %}checked{% endif %}>{{ skill.name }}</label></div>{% endfor %}</div><button class="btn btn-primary">Save interests</button></form></div></div></section>{% endblock %}
